name = "r2-cdn"
main = "index.js"
compatibility_date = "2024-09-01"

# Custom Domain: cdn.zenkai.live (requerido para que funcione la Cache API —
# caches.default no opera en *.workers.dev). Configurado desde el dashboard:
# Workers & Pages > r2-cdn > Settings > Domains & Routes > Custom Domain.

# Bucket privado (SIN "Public Development URL" habilitada). El binding le da
# acceso al Worker sin exponer el bucket directamente a internet.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "zenkai"

# El secreto se setea con:
#   wrangler secret put R2_SEAL_SECRET
# (debe ser el MISMO valor que R2_SEAL_SECRET en api_vid/.env)
